<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCSS - Red Geoespacial de Hospitales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .bg-ccss { background-color: #0d529c; }
    body {
      position: relative;
      min-height: 100vh;
      background-color: #f8f9fa;
    }
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      height: 450px;
      background-image: url('logo.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }
    .card, .navbar, footer {
      position: relative;
      z-index: 1;
    }
    #map {
      height: 500px;
      border-radius: 10px;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-dark bg-ccss shadow-sm py-3 mb-4">
    <div class="container-fluid px-4">
      <div class="d-flex align-items-center">
        <a href="index.html" class="text-white me-3 fs-5" title="Volver al inicio">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <img src="logo.png" alt="Logo CCSS" height="50" class="me-3 bg-white p-1 rounded">
        <span class="navbar-brand fw-bold fs-4 mb-0">Red Geoespacial y Ubicación de Centros</span>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-warning text-dark fw-bold" onclick="cargarMapaYHospitales()">
          <i class="fa-solid fa-rotate-right me-1"></i> Actualizar Ubicaciones
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 mb-5">
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-header bg-dark text-white py-3">
            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-earth-americas me-2"></i>Mapa Institucional de Coordenadas</h5>
          </div>
          <div class="card-body p-3">
            <div id="map"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-header bg-primary text-white py-3">
            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-location-crosshairs me-2"></i>Centros en la Red</h5>
          </div>
          <div class="card-body p-3 d-flex flex-column">
            <p class="text-muted small mb-3">
              Hospitales geolocalizados mediante consultas geoespaciales sobre la infraestructura de la red.
            </p>
            <div class="list-group overflow-auto" id="lista-centros-geo" style="max-height: 420px;">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <small class="opacity-75">
      © 2026 Caja Costarricense de Seguro Social (CCSS) — Módulo Geoespacial
    </small>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = 'http://localhost:3000/api/hospitales';
    let map = null;
    let markersLayer = null;

    document.addEventListener('DOMContentLoaded', () => {
      inicializarMapa();
      cargarMapaYHospitales();
    });

    function inicializarMapa() {
      map = L.map('map').setView([9.9328, -84.0800], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors | CCSS Costa Rica'
      }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
    }

    async function cargarMapaYHospitales() {
      markersLayer.clearLayers();
      const contenedorLista = document.getElementById('lista-centros-geo');
      contenedorLista.innerHTML = '<div class="text-center p-3 text-muted">Cargando puntos GeoJSON...</div>';

      let hospitales = [];
      try {
        const res = await fetch(API_URL);
        hospitales = await res.json();
      } catch (e) {
        console.log('Usando datos simulados GeoJSON locales...');
      }

      if (!Array.isArray(hospitales) || hospitales.length === 0) {
        hospitales = [
          {
            _id: "64b1f28e3a9a8d0012f3e901",
            nombre_hospital: "Hospital México",
            red_salud: "Red Central Norte",
            coordenadas: { type: "Point", coordinates: [-84.1167, 9.9538] },
            contacto_emergencias: "2242-6700 Ext. 102"
          },
          {
            _id: "64b1f28e3a9a8d0012f3e902",
            nombre_hospital: "Hospital Rafael Ángel Calderón Guardia",
            red_salud: "Red Central Sur",
            coordenadas: { type: "Point", coordinates: [-84.0685, 9.9358] },
            contacto_emergencias: "2257-7922 Ext. 500"
          },
          {
            _id: "64b1f28e3a9a8d0012f3e903",
            nombre_hospital: "Hospital San Juan de Dios",
            red_salud: "Red Central Sur",
            coordenadas: { type: "Point", coordinates: [-84.0837, 9.9333] },
            contacto_emergencias: "2547-2000"
          }
        ];
      }

      contenedorLista.innerHTML = '';
      let bounds = [];

      hospitales.forEach(h => {
        if (h.coordenadas && h.coordenadas.coordinates) {
          const lng = h.coordenadas.coordinates[0];
          const lat = h.coordenadas.coordinates[1];
          bounds.push([lat, lng]);

          const marker = L.marker([lat, lng]).addTo(markersLayer);
          marker.bindPopup(`
            <div class="p-1">
              <h6 class="fw-bold text-primary mb-1">${h.nombre_hospital}</h6>
              <p class="mb-1 small text-muted">Región: ${h.red_salud}</p>
              <p class="mb-0 small"><strong>Tel:</strong> ${h.contacto_emergencias || 'N/A'}</p>
            </div>
          `);

          contenedorLista.innerHTML += `
            <div class="list-group-item list-group-item-action border-0 shadow-sm mb-2 rounded bg-light">
              <div class="d-flex w-100 justify-content-between">
                <h6 class="mb-1 fw-bold text-dark"><i class="fa-solid fa-hospital text-danger me-1"></i>${h.nombre_hospital}</h6>
              </div>
              <p class="mb-1 small text-muted"><span class="badge bg-secondary">${h.red_salud}</span></p>
              <small class="text-primary font-monospace"><i class="fa-solid fa-map-pin me-1"></i>GeoJSON: [${lat}, ${lng}]</small>
            </div>
          `;
        }
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50] });
      }
    }
  </script>
</body>
</html>
